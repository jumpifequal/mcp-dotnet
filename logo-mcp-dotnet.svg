<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <radialGradient id="headGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#7dd3c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d9b85;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="gearGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#4db8a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d8b77;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Left gear tooth -->
  <g transform="translate(80, 200)">
    <rect x="-15" y="-35" width="30" height="70" rx="8" fill="url(#gearGradient)" stroke="#1a6b5f" stroke-width="2"/>
  </g>
  
  <!-- Right gear tooth -->
  <g transform="translate(320, 200)">
    <rect x="-15" y="-35" width="30" height="70" rx="8" fill="url(#gearGradient)" stroke="#1a6b5f" stroke-width="2"/>
  </g>
  
  <!-- Top gear tooth -->
  <g transform="translate(200, 80)">
    <rect x="-15" y="-35" width="30" height="70" rx="8" fill="url(#gearGradient)" stroke="#1a6b5f" stroke-width="2"/>
  </g>
  
  <!-- Bottom gear tooth -->
  <g transform="translate(200, 320)">
    <rect x="-15" y="-35" width="30" height="70" rx="8" fill="url(#gearGradient)" stroke="#1a6b5f" stroke-width="2"/>
  </g>
  
  <!-- Top-left gear tooth -->
  <g transform="translate(130, 130) rotate(-45)">
    <rect x="-15" y="-35" width="30" height="70" rx="8" fill="url(#gearGradient)" stroke="#1a6b5f" stroke-width="2"/>
  </g>
  
  <!-- Top-right gear tooth -->
  <g transform="translate(270, 130) rotate(45)">
    <rect x="-15" y="-35" width="30" height="70" rx="8" fill="url(#gearGradient)" stroke="#1a6b5f" stroke-width="2"/>
  </g>
  
  <!-- Bottom-left gear tooth -->
  <g transform="translate(130, 270) rotate(45)">
    <rect x="-15" y="-35" width="30" height="70" rx="8" fill="url(#gearGradient)" stroke="#1a6b5f" stroke-width="2"/>
  </g>
  
  <!-- Bottom-right gear tooth -->
  <g transform="translate(270, 270) rotate(-45)">
    <rect x="-15" y="-35" width="30" height="70" rx="8" fill="url(#gearGradient)" stroke="#1a6b5f" stroke-width="2"/>
  </g>
  
  <!-- Main head circle outer ring -->
  <circle cx="200" cy="200" r="110" fill="#4db8a8" stroke="#1a6b5f" stroke-width="3"/>
  
  <!-- Main head circle inner (lighter) -->
  <circle cx="200" cy="200" r="95" fill="url(#headGradient)" stroke="#1a6b5f" stroke-width="2"/>
  
  <!-- Left eye outer -->
  <circle cx="160" cy="170" r="18" fill="#ffffff" stroke="#1a6b5f" stroke-width="2"/>
  <!-- Left eye pupil -->
  <circle cx="163" cy="173" r="10" fill="#1a6b5f"/>
  <!-- Left eye shine -->
  <circle cx="166" cy="170" r="4" fill="#ffffff"/>
  
  <!-- Right eye outer -->
  <circle cx="240" cy="170" r="18" fill="#ffffff" stroke="#1a6b5f" stroke-width="2"/>
  <!-- Right eye pupil -->
  <circle cx="237" cy="173" r="10" fill="#1a6b5f"/>
  <!-- Right eye shine -->
  <circle cx="234" cy="170" r="4" fill="#ffffff"/>
  
  <!-- Smile -->
  <path d="M 170 220 Q 200 240 230 220" stroke="#1a6b5f" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Left blush -->
  <ellipse cx="130" cy="200" rx="12" ry="8" fill="#ff9db5" opacity="0.7"/>
  
  <!-- Right blush -->
  <ellipse cx="270" cy="200" rx="12" ry="8" fill="#ff9db5" opacity="0.7"/>
  
  <!-- Text label -->
  <text x="200" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#1a6b5f">mcp-dotnet</text>
</svg>
