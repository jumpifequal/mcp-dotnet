name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore mcp-dotnet.slnx
      - run: dotnet build mcp-dotnet.slnx -c Release --no-restore
      - run: dotnet test mcp-dotnet.slnx -c Release --no-build --blame-hang-timeout 2m
      - run: dotnet pack src/MCPPOC/MCPPOC.csproj -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: nupkg
          path: artifacts/*.nupkg
      # GUI console: net10.0-windows + WPF, built only here (Linux has no Windows Desktop runtime pack).
      # Deliberately not part of mcp-dotnet.slnx so the cross-platform restore/build/test above never
      # touches it; mcp-dotnet.windows.slnx is the Windows-only solution that includes it for IDE use.
      - if: matrix.os == 'windows-latest'
        run: dotnet build Console/MCPPOC.Console.csproj -c Release
      # Runs last (test/pack above need the per-project build output still in place): flattens bin/ to
      # a single level of DLL/EXE, verifying Scripts/flatten-bin.ps1 end-to-end on both OSes.
      - run: pwsh Scripts/flatten-bin.ps1
